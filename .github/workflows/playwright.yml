name: Playwright UI and API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - uat
          - prod

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}

      BROWSER: chromium
      HEADLESS: true

      DEFAULT_TIMEOUT: 60000
      EXPECT_TIMEOUT: 10000

      AUTH_URL: https://dummyjson.com/auth/login
      CLIENT_ID: not-used
      CLIENT_SECRET: not-used

      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Configure environment URLs
        shell: bash
        run: |
          echo "Selected environment: $TEST_ENV"

          if [ "$TEST_ENV" = "qa" ]; then
            echo "BASE_URL=${{ vars.QA_BASE_URL }}" >> "$GITHUB_ENV"
            echo "API_BASE_URL=${{ vars.QA_API_BASE_URL }}" >> "$GITHUB_ENV"

          elif [ "$TEST_ENV" = "uat" ]; then
            echo "BASE_URL=${{ vars.UAT_BASE_URL }}" >> "$GITHUB_ENV"
            echo "API_BASE_URL=${{ vars.UAT_API_BASE_URL }}" >> "$GITHUB_ENV"

          elif [ "$TEST_ENV" = "prod" ]; then
            echo "BASE_URL=${{ vars.PROD_BASE_URL }}" >> "$GITHUB_ENV"
            echo "API_BASE_URL=${{ vars.PROD_API_BASE_URL }}" >> "$GITHUB_ENV"

          else
            echo "Invalid environment: $TEST_ENV"
            exit 1
          fi

      - name: Validate environment variables
        shell: bash
        run: |
          echo "=========================================="
          echo "Test Environment: $TEST_ENV"
          echo "Browser: $BROWSER"
          echo "Headless: $HEADLESS"
          echo "Base URL: $BASE_URL"
          echo "API Base URL: $API_BASE_URL"
          echo "=========================================="

          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL is empty"
            exit 1
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "ERROR: API_BASE_URL is empty"
            exit 1
          fi

          echo "Environment variables are available."

      - name: Run UI and API tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: reports/results.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/