name: Playwright UI and API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual execution
  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - uat
          - prod

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    env:
      # Use selected environment for manual execution.
      # Push/PR executions continue to use QA.
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}

      BROWSER: chromium
      HEADLESS: true

      DEFAULT_TIMEOUT: 60000
      EXPECT_TIMEOUT: 10000

      BASE_URL: https://www.saucedemo.com/
      API_BASE_URL: https://dummyjson.com

      AUTH_URL: https://dummyjson.com/auth/login
      CLIENT_ID: not-used
      CLIENT_SECRET: not-used

      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Chromium and required dependencies
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # 5. Display selected environment
      - name: Display test environment
        run: |
          echo "Test Environment: $TEST_ENV"
          echo "Browser: $BROWSER"
          echo "Headless: $HEADLESS"

      # 6. Run UI + API tests
      - name: Run UI and API tests
        run: npx playwright test

      # 7. Upload HTML report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/

      # 8. Upload JUnit results
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: reports/results.xml

      # 9. Upload failure screenshots/videos/traces
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/